name: Auxmoney
description: 'Auxmoney (auxmoney GmbH) is a Düsseldorf-based German fintech operating
  one of Europe''s largest online lending marketplaces, connecting consumer and small-business
  borrowers with private and institutional investors. Its fully digital platform handles
  personal-loan applications end to end — identity and credit checks, risk scoring,
  approval within seconds, and disbursement typically within 24 hours — funded by
  retail investors and institutional capital via its investment arm. Surfaced as a
  portfolio company of Index Ventures. auxmoney publishes no public developer API or
  portal; its integration surface is a partner/affiliate program plus internal open-source
  tooling on GitHub. This profile is maintained by the API Evangelist enrichment pipeline.'
